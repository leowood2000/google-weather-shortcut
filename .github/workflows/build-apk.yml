name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        env:
          GWS_KEYSTORE_BASE64: ${{ secrets.GWS_KEYSTORE_BASE64 }}
          GWS_KEYSTORE_PASSWORD: ${{ secrets.GWS_KEYSTORE_PASSWORD }}
          GWS_KEY_ALIAS: ${{ secrets.GWS_KEY_ALIAS }}
          GWS_KEY_PASSWORD: ${{ secrets.GWS_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build debug APK (fallback, no signing)
        run: gradle assembleDebug

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-weather-shortcut-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-weather-shortcut-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
