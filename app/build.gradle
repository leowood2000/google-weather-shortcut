plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.leowood2000.weathershortcut'
    compileSdk 35

    defaultConfig {
        applicationId "com.leowood2000.weathershortcut"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            if (System.getenv("GWS_KEYSTORE_BASE64") != null) {
                // CI 环境：从 Secrets 解码 keystore
                def keystoreFile = file("release-keystore.jks")
                keystoreFile.bytes = Base64.getDecoder().decode(System.getenv("GWS_KEYSTORE_BASE64"))
                storeFile keystoreFile
                storePassword System.getenv("GWS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GWS_KEY_ALIAS")
                keyPassword System.getenv("GWS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("GWS_KEYSTORE_BASE64") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Shizuku API (免 root 通过 adb 授权调用 shell)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}